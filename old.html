  <style>
    /* Card Styles */
    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(280px, 1fr)
      );
      gap: 25px;
      margin-top: 30px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 15px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      transition: transform 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .card-body {
      padding: 20px;
    }

    .card-body h3 {
      color: var(--primary-color);
      margin-bottom: 8px;
    }

    /* Music Player */
    .music-sec {
      margin-top: 50px;
      background: rgba(255,255,255,0.03);
      padding: 30px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
    }

    .song-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
